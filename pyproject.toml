[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "closure-se"
version = "0.1.0a1"
description = "Local engineering evidence compiler and project explorer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Keystone Intelligence LLC"}]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering",
]
dependencies = ["pydantic>=2.9,<3", "ruamel.yaml>=0.18,<0.19", "pint>=0.24,<0.26"]

[project.urls]
Homepage = "https://www.keystoneintelligence.ai/"
Repository = "https://github.com/keystoneintelligence/closure"
Issues = "https://github.com/keystoneintelligence/closure/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "hypothesis>=6,<7", "jsonschema>=4.23,<5"]
release = ["build>=1.2,<2", "twine>=6,<7"]
cad = ["cadquery>=2.5,<3", "trimesh>=4,<5"]
mission = ["sgp4>=2.23,<3"]

[project.scripts]
closure = "closure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
closure = ["viewer/*", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
