name: Closure core and viewer

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev,mission,release]"
      - name: Verify core and cross-domain workflows
        run: python -m pytest -q --ignore=tests/test_pen.py --junitxml=docs/verification/preview-core.xml
      - name: Install viewer dependencies
        run: npm --prefix frontend ci
      - name: Verify project-driven visualization behavior
        run: npm --prefix frontend test
      - name: Build viewer
        run: npm --prefix frontend run build
      - name: Check coordinated versions and schemas
        run: python tools/check_preview.py
      - name: Prepare curated release source
        run: python tools/prepare_preview.py --output dist/review
      - name: Audit exact source artifact
        run: python tools/audit_preview.py dist/review
      - name: Build candidate distributions from curated source
        run: python -m build dist/review/source --outdir dist/packages
      - name: Check distribution metadata
        run: python -m twine check dist/packages/*
      - name: Verify fresh installation and dependency resolution
        run: python tools/smoke_wheel.py dist/packages/closure_se-0.1.0a1-py3-none-any.whl --isolated --output docs/verification/preview-package.json
      - name: Install browser runtimes
        if: matrix.python == '3.12'
        run: npm --prefix frontend exec -- playwright install --with-deps chromium firefox
      - name: Verify real browser editing and history
        if: matrix.python == '3.12'
        run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-review-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            docs/verification/preview-*.xml
            docs/verification/preview-*.json
            dist/packages/*
            dist/review/*.zip
            dist/review/manifest.json
          retention-days: 14
