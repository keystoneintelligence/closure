name: Closure core and viewer

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev,mission,release]"
      - name: Check the composition
        run: closure check --project examples/composed-power
      - name: Verify the composition at the checked-out revision
        id: assessment
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          from closure.cli_output import render

          project = Path("examples/composed-power")
          result = subprocess.run(["closure", "verify", "--project", str(project), "--trusted", "--json"], stdout=subprocess.PIPE)
          if result.returncode in (0, 1):
              report = json.loads(result.stdout)
              print(render(report, "verify", project))
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
                  print(f"report_id={report['id']}", file=outputs)
          else:
              sys.stdout.buffer.write(result.stdout)
          sys.exit(result.returncode)
      - name: Export the sealed composition report
        id: export_composition
        if: ${{ !cancelled() && steps.assessment.outputs.report_id != '' }}
        env:
          REPORT_ID: ${{ steps.assessment.outputs.report_id }}
        shell: bash
        run: closure export --project examples/composed-power --report "$REPORT_ID" --output dist/composed-report
      - name: Check report provenance
        if: ${{ !cancelled() && steps.export_composition.outcome == 'success' }}
        shell: python
        env:
          VERIFY_OUTCOME: ${{ steps.assessment.outcome }}
        run: |
          import json, os, subprocess
          from pathlib import Path

          report = json.loads(Path("dist/composed-report/report.json").read_bytes())
          assert report["gate"] == (os.environ["VERIFY_OUTCOME"] == "success")
          assert report["revision"]["state"] == "committed inputs"
          assert report["revision"]["commit"] == subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
      - name: Verify core and cross-domain workflows
        run: python -m pytest -q --ignore=tests/test_pen.py --junitxml=docs/verification/preview-core.xml
      - name: Install viewer dependencies
        run: npm --prefix frontend ci
      - name: Verify project-driven visualization behavior
        run: npm --prefix frontend test
      - name: Build viewer
        run: npm --prefix frontend run build
      - name: Check coordinated versions and schemas
        run: python tools/check_preview.py
      - name: Prepare curated release source
        run: python tools/prepare_preview.py --output dist/review
      - name: Audit exact source artifact
        run: python tools/audit_preview.py dist/review
      - name: Build candidate distributions from curated source
        run: python -m build dist/review/source --outdir dist/packages
      - name: Check distribution metadata
        run: python -m twine check dist/packages/*
      - name: Verify fresh installation and dependency resolution
        run: python tools/smoke_wheel.py dist/packages/closure_se-0.2.0a1-py3-none-any.whl --isolated --output docs/verification/preview-package.json
      - name: Install browser runtimes
        if: matrix.python == '3.12'
        run: npm --prefix frontend exec -- playwright install --with-deps chromium firefox
      - name: Verify real browser editing and history
        if: matrix.python == '3.12'
        run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-review-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            docs/verification/preview-*.xml
            docs/verification/preview-*.json
            dist/composed-report/
            dist/packages/*
            dist/review/*.zip
            dist/review/manifest.json
          retention-days: 14
